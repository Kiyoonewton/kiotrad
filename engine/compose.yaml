name: kiotrad

x-collector: &collector
  profiles: [collectors]
  build:
    context: ..
    dockerfile: engine/api.Dockerfile
  env_file: .env
  depends_on:
    mongodb:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 35s

services:
  collector-english:
    <<: *collector
    command: [php, artisan, 'provider:watch', virtual-football]
  collector-bundesliga:
    <<: *collector
    command: [php, artisan, 'provider:watch', virtual-bundesliga]
  collector-euro:
    <<: *collector
    command: [php, artisan, 'provider:watch', virtual-euro]

  mongodb:
    image: mongo:7
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: engine/api.Dockerfile
    env_file: .env
    volumes:
      - provider_diagnostics:/app/storage/app/private/provider-probes
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/ready') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: engine/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data:
  provider_diagnostics:
