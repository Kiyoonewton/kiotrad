name: kiotrad

x-collector: &collector
  profiles: [collectors]
  build:
    context: ..
    dockerfile: engine/api.Dockerfile
  env_file: .env
  volumes:
    - provider_evidence:/app/storage/app/private/provider-evidence
  depends_on:
    mongodb:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 35s

services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --maxmemory, 256mb, --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
    mem_limit: 320m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dashboard-worker:
    build:
      context: ..
      dockerfile: engine/api.Dockerfile
    env_file: .env
    command: [php, artisan, 'dashboard:watch']
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s

  notification-worker:
    <<: *collector
    profiles: [notifications]
    command: [php, artisan, 'notifications:watch']

  collector-english:
    <<: *collector
    command: [php, artisan, 'provider:watch', virtual-football]
  collector-bundesliga:
    <<: *collector
    command: [php, artisan, 'provider:watch', virtual-bundesliga]
  collector-euro:
    <<: *collector
    command: [php, artisan, 'provider:watch', virtual-euro]

  paper-worker:
    <<: *collector
    profiles: [paper]
    command: [php, artisan, 'paper:watch']

  mongodb:
    image: mongo:7
    command: ["mongod", "--auth", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: engine/api.Dockerfile
    env_file: .env
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    command: [php, artisan, serve, --host=0.0.0.0, --port=8000, --no-reload]
    volumes:
      - provider_diagnostics:/app/storage/app/private/provider-probes
      - provider_evidence:/app/storage/app/private/provider-evidence
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/ready') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: engine/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data:
  provider_diagnostics:
  provider_evidence:
