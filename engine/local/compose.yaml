name: kiotrad-local

x-app: &app
  build:
    context: ../..
    dockerfile: engine/api.Dockerfile
    target: local
  env_file: .env.local
  environment: &environment
    MONGODB_URI: mongodb://mongodb:27017/${LOCAL_DATABASE:-kiotrad_local}
    MONGODB_DATABASE: ${LOCAL_DATABASE:-kiotrad_local}
    LOCAL_DATA_MIRROR: "true"
    DASHBOARD_ASYNC: "true"
    SIMULATION_CACHE_ENABLED: "true"
    REDIS_HOST: redis
    REDIS_LOCK_HOST: redis-locks
    SLACK_NOTIFICATIONS_ENABLED: "false"
  volumes:
    - dashboard_views:/app/storage/app/private/dashboard-views
  restart: unless-stopped

services:
  mongodb:
    image: mongo:7
    labels:
      kiotrad.local-only: "true"
    ports: ["127.0.0.1:27019:27017"]
    volumes: [local_mongo_data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    mem_limit: 640m
    command: [redis-server, --maxmemory, "${REDIS_CACHE_MAXMEMORY:-512mb}", --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
    restart: unless-stopped
  redis-locks:
    image: redis:7-alpine
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, noeviction, --save, "", --appendonly, "no"]
    mem_limit: 96m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    <<: *app
    depends_on:
      redis-locks:
        condition: service_healthy
    environment:
      <<: *environment
      PHP_CLI_SERVER_WORKERS: "4"
    command: [php, artisan, serve, --host=0.0.0.0, --port=8000, --no-reload]
    ports: ["127.0.0.1:8011:8000"]
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/ready') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
  dashboard-worker:
    <<: *app
    depends_on:
      redis-locks:
        condition: service_healthy
    command: [php, artisan, 'dashboard:watch']
  web:
    build:
      context: ../..
      dockerfile: engine/web.Dockerfile
    ports: ["127.0.0.1:5174:80"]
    restart: unless-stopped

volumes:
  dashboard_views:
    name: kiotrad_local_dashboard_views
  local_mongo_data:
    name: kiotrad_local_mongo_data
